#:schema https://yazi-rs.github.io/schemas/yazi.json

[[plugin.prepend_previewers]]
url = "*.md"
run = 'piper -- CLICOLOR_FORCE=1 glow -w=$w -s=dark "$1"'

[[plugin.prepend_previewers]]
mime = "image/{avif,hei?,jxl,svg+xml}"
run = 'magick'

[[plugin.prepend_previewers]]
url = "*.avif"
run = 'magick'

[[plugin.append_previewers]]
url = "*"
run = 'piper -- hexyl --border=none --terminal-width=$w "$1"'

[[plugin.append_previewers]]
mime = "image/{avif,hei?,jxl,svg+xml}"
run = "magick"

[[plugin.append_previewers]]
url = "*.avif"
run = "magick"

[[plugin.prepend_previewers]]
url = "*.kra{,~}"
run = 'krita-preview'

[[plugin.prepend_preloaders]]
url = "*.kra{,~}"
run = 'krita-preview'

[[plugin.prepend_previewers]]
url = "*.typ"
run = 'preview-typst'

[[plugin.prepend_preloaders]]
url = "*.typ"
run = 'preview-typst'

[[plugin.prepend_previewers]]
url = "*.epub"
run = 'preview-epub'

[[plugin.prepend_preloaders]]
url = "*.epub"
run = 'preview-epub'

[[plugin.prepend_previewers]]
url = "*.cb{z,r}"
run = 'preview-cbz'

[[plugin.prepend_preloaders]]
url = "*.cb{z,r}"
run = 'preview-cbz'

[[plugin.prepend_previewers]]
mime = "application/ms-opentype"
run = 'font-sample'

[[plugin.prepend_preloaders]]
mime = "application/ms-opentype"
run = 'font-sample'

[[plugin.prepend_previewers]]
mime = "font/*"
run = 'font-sample'

[[plugin.prepend_preloaders]]
mime = "font/*"
run = 'font-sample'

[[plugin.prepend_previewers]]
url = "*.{otf,ttf,woff,woff2}"
run = 'font-sample'

[[plugin.prepend_preloaders]]
url = "*.{otf,ttf,woff,woff2}"
run = 'font-sample'


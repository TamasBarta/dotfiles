general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    unlock_cmd = pkill -USR1 hyprlock
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
    after_sleep_cmd = niri msg action power-on-monitors  # wake display after resume (niri, not hyprctl).
}

listener {
    timeout = 120                                # 2min: dim.
    on-timeout = brightnessctl -s set 10         # set monitor backlight to minimum
    on-resume = brightnessctl -r                 # monitor backlight restore.
}

# turn off keyboard backlight
listener {
    timeout = 120
    on-timeout = brightnessctl -sd rgb:kbd_backlight set 0
    on-resume = brightnessctl -rd rgb:kbd_backlight
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 330                                 # 5.5min
    on-timeout = niri msg action power-off-monitors   # was `hyprctl dispatch dpms off`, which does nothing under niri
    on-resume = niri msg action power-on-monitors
}

listener {
    timeout = 900                                 # 15min: suspend, only on battery
    on-timeout = [ "$(cat /sys/class/power_supply/ADP1/online)" = 0 ] && systemctl suspend
}

set -g default-terminal "screen-256color"
unbind r
bind r source-file ~/.config/tmux/tmux.conf

setw -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# workmux dashboard in a floating window
bind-key C-d display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "workmux dashboard"

# toggle the workmux sidebar
bind-key b run-shell -b "workmux sidebar"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'

set -g status-position bottom

set -g allow-passthrough on

set -g @catppuccin_flavor 'mocha' # latte, frappe, macchiato, mocha
set -g @catppuccin_window_status_style "rounded"

# Tab text is the window name (#W). workmux exposes its agent status icon as the
# @workmux_status window option, so append it here instead of letting workmux
# overwrite window-status-format (see status_format: false in workmux config).
set -g @catppuccin_window_text " #W#{?@workmux_status, #{@workmux_status},}"
set -g @catppuccin_window_current_text " #W#{?@workmux_status, #{@workmux_status},}"

set -g pane-active-border-style "bg=default,fg=colour166"
set -g pane-border-style "bg=default,fg=colour245"
set -g pane-border-lines "double"

# Plugins live in the XDG data dir, not the config dir
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.local/share/tmux/plugins/'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.local/share/tmux/plugins/tpm/tpm'
source-file -q "$XDG_CONFIG_HOME/tmux/themes/matugen.conf"
